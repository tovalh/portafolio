<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
  <defs>
    <marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#34d399"/></marker>
    <marker id="aC" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#38bdf8"/></marker>
    <marker id="aA" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#f59e0b"/></marker>
    <marker id="aM" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#7d8aa0"/></marker>
  </defs>

  <rect x="0" y="0" width="1200" height="700" fill="#0b0f16"/>

  <!-- Title -->
  <text x="40" y="48" fill="#e5e9f0" font-size="22" font-weight="700">Plataforma SaaS multi-servicio</text>
  <text x="40" y="72" fill="#7d8aa0" font-size="13">ERP (Laravel) + notificaciones realtime (Go) + monitor de salud (Go)</text>
  <text x="1160" y="48" fill="#34d399" font-size="12" text-anchor="end">// ARQUITECTURA</text>

  <!-- Railway boundary -->
  <rect x="210" y="96" width="700" height="520" rx="14" fill="none" stroke="#223041" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="230" y="120" fill="#8b5cf6" font-size="12" font-weight="700">RAILWAY · proyecto · red privada</text>

  <!-- WSS big arc: notif_service -> browser -->
  <path d="M 780 140 C 780 24, 105 24, 105 150" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#aC)"/>
  <text x="442" y="20" fill="#38bdf8" font-size="12" text-anchor="middle">WSS · realtime (token HMAC)</text>

  <!-- /notify arc: LaraVentas -> notif_service -->
  <path d="M 400 140 C 440 104, 700 104, 738 140" fill="none" stroke="#7d8aa0" stroke-width="1.6" stroke-dasharray="2 4" marker-end="url(#aM)"/>
  <text x="569" y="98" fill="#7d8aa0" font-size="11" text-anchor="middle">POST /notify · privado</text>

  <!-- Browser -->
  <rect x="30" y="150" width="150" height="84" rx="10" fill="#131a24" stroke="#2b3a4d"/>
  <text x="105" y="180" fill="#7d8aa0" font-size="10" text-anchor="middle">CLIENTE</text>
  <text x="105" y="200" fill="#e5e9f0" font-size="14" font-weight="700" text-anchor="middle">Navegador</text>
  <text x="105" y="219" fill="#93a1b5" font-size="11" text-anchor="middle">Vue SPA</text>

  <!-- LaraVentas -->
  <rect x="250" y="140" width="190" height="104" rx="10" fill="#10233a" stroke="#34d399"/>
  <text x="345" y="168" fill="#34d399" font-size="10" text-anchor="middle">APP · ERP</text>
  <text x="345" y="189" fill="#e5e9f0" font-size="15" font-weight="700" text-anchor="middle">LaraVentas</text>
  <text x="345" y="209" fill="#93a1b5" font-size="10.5" text-anchor="middle">Laravel · Inertia</text>
  <text x="345" y="225" fill="#93a1b5" font-size="10.5" text-anchor="middle">Vue · PrimeVue</text>

  <!-- MySQL -->
  <rect x="490" y="152" width="140" height="80" rx="10" fill="#131a24" stroke="#2b3a4d"/>
  <text x="560" y="180" fill="#7d8aa0" font-size="10" text-anchor="middle">DATOS</text>
  <text x="560" y="200" fill="#e5e9f0" font-size="14" font-weight="700" text-anchor="middle">MySQL</text>
  <text x="560" y="218" fill="#93a1b5" font-size="10.5" text-anchor="middle">multi-empresa</text>

  <!-- notif_service -->
  <rect x="690" y="140" width="180" height="104" rx="10" fill="#10233a" stroke="#34d399"/>
  <text x="780" y="168" fill="#34d399" font-size="10" text-anchor="middle">MICROSERVICIO</text>
  <text x="780" y="189" fill="#e5e9f0" font-size="15" font-weight="700" text-anchor="middle">notif_service</text>
  <text x="780" y="209" fill="#93a1b5" font-size="10.5" text-anchor="middle">Go · WebSocket</text>
  <text x="780" y="225" fill="#93a1b5" font-size="10.5" text-anchor="middle">polling + push</text>

  <!-- health_status -->
  <rect x="360" y="452" width="210" height="104" rx="10" fill="#241a10" stroke="#f59e0b"/>
  <text x="465" y="480" fill="#f59e0b" font-size="10" text-anchor="middle">OBSERVABILIDAD</text>
  <text x="465" y="501" fill="#e5e9f0" font-size="15" font-weight="700" text-anchor="middle">health_status</text>
  <text x="465" y="521" fill="#93a1b5" font-size="10.5" text-anchor="middle">Go · monitor</text>
  <text x="465" y="537" fill="#93a1b5" font-size="10.5" text-anchor="middle">flap-filter · dependencias</text>

  <!-- Telegram -->
  <rect x="980" y="430" width="180" height="56" rx="10" fill="#131a24" stroke="#2b3a4d"/>
  <text x="1070" y="454" fill="#e5e9f0" font-size="13" font-weight="700" text-anchor="middle">Telegram</text>
  <text x="1070" y="472" fill="#93a1b5" font-size="10.5" text-anchor="middle">Bot API</text>

  <!-- Email -->
  <rect x="980" y="510" width="180" height="56" rx="10" fill="#131a24" stroke="#2b3a4d"/>
  <text x="1070" y="534" fill="#e5e9f0" font-size="13" font-weight="700" text-anchor="middle">Email</text>
  <text x="1070" y="552" fill="#93a1b5" font-size="10.5" text-anchor="middle">SMTP · Zoho</text>

  <!-- Edges: request/data path -->
  <line x1="180" y1="192" x2="248" y2="192" stroke="#34d399" stroke-width="2" marker-end="url(#aG)" marker-start="url(#aG)"/>
  <text x="214" y="182" fill="#34d399" font-size="10" text-anchor="middle">HTTPS</text>

  <line x1="440" y1="192" x2="488" y2="192" stroke="#7d8aa0" stroke-width="1.8" marker-end="url(#aM)"/>
  <line x1="630" y1="192" x2="688" y2="192" stroke="#7d8aa0" stroke-width="1.8" marker-end="url(#aM)"/>
  <text x="660" y="182" fill="#7d8aa0" font-size="10" text-anchor="middle">lee tabla</text>

  <!-- health checks up -->
  <path d="M 430 452 C 400 380, 372 300, 366 246" fill="none" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#aA)"/>
  <text x="322" y="360" fill="#f59e0b" font-size="10" text-anchor="middle">/up · /deps</text>
  <path d="M 545 452 C 650 392, 748 306, 772 246" fill="none" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#aA)"/>
  <text x="700" y="372" fill="#f59e0b" font-size="10" text-anchor="middle">/health</text>

  <!-- alerts -->
  <path d="M 570 486 C 760 470, 860 462, 978 460" fill="none" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#aA)"/>
  <path d="M 570 512 C 760 528, 860 534, 978 536" fill="none" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#aA)"/>
  <text x="775" y="500" fill="#f59e0b" font-size="10" text-anchor="middle">alerta al cambiar de estado</text>

  <!-- Legend -->
  <text x="40" y="632" fill="#7d8aa0" font-size="11" font-weight="700">LEYENDA</text>
  <line x1="120" y1="628" x2="150" y2="628" stroke="#34d399" stroke-width="2"/>
  <text x="158" y="632" fill="#93a1b5" font-size="11">HTTPS / Inertia</text>
  <line x1="290" y1="628" x2="320" y2="628" stroke="#38bdf8" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="328" y="632" fill="#93a1b5" font-size="11">WebSocket</text>
  <line x1="440" y1="628" x2="470" y2="628" stroke="#7d8aa0" stroke-width="1.8" stroke-dasharray="2 4"/>
  <text x="478" y="632" fill="#93a1b5" font-size="11">red privada / datos</text>
  <line x1="640" y1="628" x2="670" y2="628" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="678" y="632" fill="#93a1b5" font-size="11">health-checks / alertas</text>
</svg>
